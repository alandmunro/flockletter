<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Your thank-you gift · Flockletter</title>
    <link rel="stylesheet" href="/subscriber-action.css" />
    <script src="/workspace-gift.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Your thank-you gift</h1>
      <p id="sender" hidden></p>
      <p id="details" hidden></p>
      <p id="status" role="status" aria-live="polite">Checking your offer…</p>
      <button type="button" id="claim" hidden>Claim gift</button>
      <a id="reward" rel="noreferrer noopener" hidden>Open my reward at Tremendous</a>
      <button type="button" id="check" hidden>Check gift status</button>
      <noscript><p>Enable JavaScript to view and claim your gift.</p></noscript>
    </main>
  </body>
</html>
