name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  listmonk-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: bash scripts/listmonk-capture/run.sh
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/studio-notices.mjs --check-build
      - run: npx playwright-core install --with-deps chromium webkit
      - run: npm run audience:verify
      - run: node --import tsx scripts/prove-team-ui.ts
      - run: node --import tsx scripts/prove-studio.ts
      - run: node --import tsx scripts/prove-studio-email.ts
      - run: node --import tsx scripts/prove-marketing-unsubscribe.ts
      - run: node --import tsx scripts/generate-api.ts && git diff --exit-code -- docs/api/openapi.json
      - run: npm audit --audit-level=moderate
