name: Promote to production
run-name: Promote to production · ${{ inputs.request_id || 'manual' }}

# Deploys ONE exact, already-staged commit to the production Render service. Dispatched from
# Mission Control (Tailscale-gated) or by hand. It never runs database migrations: those use the
# protected release runner on Render's private network (docs/implementation/RELEASE_PARITY.md).
#
# One-time setup in the repository settings:
#   secret RENDER_API_KEY                  Render API key allowed to deploy the production service
#   variable RENDER_PRODUCTION_SERVICE_ID  the production web service id (srv-...)
#   optional variables FLOCKLETTER_STAGING_URL, FLOCKLETTER_PRODUCTION_URL, FLOCKLETTER_PRODUCTION_ALIAS_URL
#   an Environment named "production" (add required reviewers there if a second approval is wanted)
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit that staging is serving
        required: true
        type: string
      migrations_applied:
        description: The protected production migration for this commit was already applied
        required: true
        type: choice
        default: 'false'
        options: ['false', 'true']
      request_id:
        description: Mission Control release correlation ID (optional for manual runs)
        required: false
        type: string
      dry_run:
        description: Run every check, including a read-only Render identity check, but stop before deploying
        required: false
        type: choice
        default: 'false'
        options: ['false', 'true']

concurrency:
  group: flockletter-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.FLOCKLETTER_PRODUCTION_ALIAS_URL || 'https://preview.flockletter.frostyflamingosoftware.com' }}
    env:
      SHA: ${{ inputs.sha }}
      MIGRATIONS_APPLIED: ${{ inputs.migrations_applied }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      STAGING_URL: ${{ vars.FLOCKLETTER_STAGING_URL || 'https://flockletter-staging.onrender.com' }}
      PRODUCTION_URL: ${{ vars.FLOCKLETTER_PRODUCTION_URL || 'https://flockletter-production.onrender.com' }}
      PRODUCTION_ALIAS_URL: ${{ vars.FLOCKLETTER_PRODUCTION_ALIAS_URL || 'https://preview.flockletter.frostyflamingosoftware.com' }}
    steps:
      - name: Validate release inputs
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::A full lowercase 40-character commit SHA is required."; exit 1; }
          [[ "${MIGRATIONS_APPLIED}" =~ ^(true|false)$ ]] || { echo "::error::migrations_applied must be true or false."; exit 1; }
          [[ -z "${REQUEST_ID}" || "${REQUEST_ID}" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::request_id must be 32 hex characters."; exit 1; }

      - name: Check out the exact release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the commit is on main
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "${SHA}" ] || { echo "::error::Checkout did not resolve to the requested commit."; exit 1; }
          git merge-base --is-ancestor "${SHA}" origin/main || { echo "::error::The requested commit is not on main."; exit 1; }

      - name: Require the release checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Ask each workflow directly: listing every run for a SHA is capped per page and other
          # workflows share main's SHA, which can push a passing run off the page.
          for workflow in ci.yml selfhost.yml; do
            count="$(gh api "repos/${REPO}/actions/workflows/${workflow}/runs?head_sha=${SHA}&status=success&per_page=30" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
            [ "${count}" -gt 0 ] || { echo "::error::${workflow} has no successful run for this exact commit."; exit 1; }
          done

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Verify staging serves this exact commit and is ready
        run: node scripts/verify-release.mjs --environment staging --url "${STAGING_URL}" --expected-sha "${SHA}" --timeout-ms 300000

      - name: Require the protected migration when the schema changed
        run: |
          set -euo pipefail
          # Production's current commit comes from its own version endpoint. If it is unknown (a build
          # before that endpoint existed) the change set cannot be ruled out, so it counts as changed.
          production_sha="$(curl -fsS --max-time 30 "${PRODUCTION_URL}/api/health/version" | jq -r '.buildSha // empty' || true)"
          changed=unknown
          if [[ "${production_sha}" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${production_sha}^{commit}" 2>/dev/null; then
            if git diff --quiet "${production_sha}" "${SHA}" -- migrations; then changed=false; else changed=true; fi
          fi
          echo "production_sha=${production_sha:-unknown} migrations_changed=${changed}"
          if [ "${changed}" != "false" ] && [ "${MIGRATIONS_APPLIED}" != "true" ]; then
            echo "::error::Database migrations changed or cannot be ruled out. Apply them with the protected production migration runner, then re-run with migrations_applied=true."
            exit 1
          fi

      - name: Confirm the Render service is Flockletter production
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_PRODUCTION_SERVICE_ID: ${{ vars.RENDER_PRODUCTION_SERVICE_ID }}
        run: |
          set -euo pipefail
          [[ "${RENDER_PRODUCTION_SERVICE_ID}" =~ ^srv-[a-z0-9]{20}$ ]] || { echo "::error::Repository variable RENDER_PRODUCTION_SERVICE_ID is missing or malformed."; exit 1; }
          # Read-only. Refuse to deploy to anything that is not the Flockletter production web service.
          service="$(curl -fsS --max-time 30 -H "Authorization: Bearer ${RENDER_API_KEY}" "https://api.render.com/v1/services/${RENDER_PRODUCTION_SERVICE_ID}")" \
            || { echo "::error::Render rejected the API key or the service id (read-only check failed)."; exit 1; }
          [ "$(jq -r '.type' <<<"${service}")" = "web_service" ] || { echo "::error::The Render service is not a web service."; exit 1; }
          [ "$(jq -r '.repo' <<<"${service}")" = "https://github.com/${{ github.repository }}" ] || { echo "::error::The Render service does not deploy this repository."; exit 1; }
          [ "$(jq -r '.serviceDetails.url // empty' <<<"${service}")" = "${PRODUCTION_URL}" ] || { echo "::error::The Render service is not the one serving ${PRODUCTION_URL}."; exit 1; }
          echo "Render service $(jq -r '.name' <<<"${service}") is the Flockletter production web service."

      - name: Deploy production
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_PRODUCTION_SERVICE_ID: ${{ vars.RENDER_PRODUCTION_SERVICE_ID }}
        run: |
          set -euo pipefail
          [ -n "${RENDER_PRODUCTION_SERVICE_ID}" ] || { echo "::error::Repository variable RENDER_PRODUCTION_SERVICE_ID is not set."; exit 1; }
          scripts/render-deploy.sh "${RENDER_PRODUCTION_SERVICE_ID}" "${SHA}"

      - name: Verify production serves the exact release on both addresses
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          node scripts/verify-release.mjs --environment production \
            --url "${PRODUCTION_URL}" --url "${PRODUCTION_ALIAS_URL}" \
            --expected-sha "${SHA}" --timeout-ms 300000

      - name: Dry run finished without deploying
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          echo "Dry run finished: every gate passed and the Render service identity is confirmed. Nothing was deployed."
